<!-- Layout principal (header, sidebar, footer) uniquement pour les routes non-auth -->
<ng-container *ngIf="!isAuthRoute">
  <app-navbar
    [userInfo]="currentUserInfo()"
    (logout)="handleLogout()"
    (toggleSidebar)="toggleSidebar()">
  </app-navbar>

  <app-sidebar
    [isOpen]="isSidebarOpen()"
    [userInfo]="currentUserInfo()"
    (closeSidebar)="closeSidebar()"
    (logout)="handleLogout()">
  </app-sidebar>

  <main class="main-content" [class.sidebar-open]="isSidebarOpen()">
    <div class="container py-4">
      <router-outlet></router-outlet>
    </div>
  </main>

  <app-footer></app-footer>
</ng-container>

<!-- Layout d'authentification (sans header, sidebar, footer) -->
<ng-container *ngIf="isAuthRoute">
  <router-outlet></router-outlet>
</ng-container>
