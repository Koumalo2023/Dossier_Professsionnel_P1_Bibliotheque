<div class="access-denied-page">
  <div class="access-denied-page__container">
    <app-icon name="fa-exclamation-triangle" size="3x" color="danger"></app-icon>
    
    <app-heading level="h1" color="primary" align="center">
      Accès Refusé
    </app-heading>

    <app-text variant="body" color="text-secondary" align="center" class="access-denied-page__message">
      Vous n’avez pas les autorisations nécessaires pour accéder à cette page.
    </app-text>

    <div class="access-denied-page__actions">
      <app-button
        variant="primary"
        iconLeft="fa-home"
        (clicked)="goHome()"
      >
        Retour à l’accueil
      </app-button>

      <app-button
        variant="outline-primary"
        iconLeft="fa-sign-in-alt"
        (clicked)="goToLogin()"
      >
        Se connecter avec un autre compte
      </app-button>
    </div>
  </div>
</div>
