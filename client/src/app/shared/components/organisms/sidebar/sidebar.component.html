<aside
  class="sidebar"
  [class.sidebar--open]="isOpen"
  (click)="closeSidebar.emit()"
>
  <div class="sidebar__content" (click)="$event.stopPropagation()">
    <!-- En-tête utilisateur -->
    @if (isLoggedIn()) {
      <div class="sidebar__header">
        <app-user-avatar [user]="userInfo!" size="lg"></app-user-avatar>
        <div class="sidebar__user-info">
          <app-typography variant="body" weight="semibold">{{ userInfo?.name }}</app-typography>
          <app-typography variant="small" color="text-secondary">{{ userRole }}</app-typography>
        </div>
      </div>

      <hr class="sidebar__divider" />
    }

    <!-- Navigation -->
    <nav class="sidebar__nav">
      <button class="sidebar__link" (click)="navigateTo('/books')">
        <app-icon name="fa-book" color="primary"></app-icon>
        <app-typography variant="body" weight="medium">Catalogue</app-typography>
      </button>

      @if (isLoggedIn()) {
        <button class="sidebar__link" (click)="navigateTo('/profile')">
          <app-icon name="fa-user" color="primary"></app-icon>
          <app-typography variant="body" weight="medium">Mon Profil</app-typography>
        </button>

        @if (isAdminOrManager()) {
          <button class="sidebar__link" (click)="navigateTo('/admin/statistics')">
            <app-icon name="fa-chart-line" color="primary"></app-icon>
            <app-typography variant="body" weight="medium">Administration</app-typography>
          </button>
        }

        <button class="sidebar__link sidebar__link--danger" (click)="onLogout()">
          <app-icon name="fa-sign-out-alt" color="danger"></app-icon>
          <app-typography variant="body" weight="medium" color="danger">Déconnexion</app-typography>
        </button>
      } @else {
        <button class="sidebar__link" (click)="navigateTo('/auth/login')">
          <app-icon name="fa-sign-in-alt" color="primary"></app-icon>
          <app-typography variant="body" weight="medium">Connexion</app-typography>
        </button>
      }
    </nav>

    <!-- Pied de page -->
    <footer class="sidebar__footer">
      <app-typography variant="small" color="text-secondary">
        © <span id="current-year"></span> Bibliothèque Numérique
      </app-typography>
    </footer>
  </div>
</aside>
