<aside class="sidebar" [class.sidebar--open]="isOpen">
    <div class="sidebar__header">
      <h2 class="sidebar__title">Bibliothèque</h2>
      <button class="sidebar__close" (click)="onCloseClick()" aria-label="Fermer">
        <span class="sidebar__close-icon">&times;</span>
      </button>
    </div>
  
    <div class="sidebar__content">
      <nav class="sidebar__nav">
        <ul class="sidebar__menu">
          <li class="sidebar__item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="sidebar__link" (click)="onNavLinkClick()">
              <i class="sidebar__icon">🏠</i>
              <span>Accueil</span>
            </a>
          </li>
          <li class="sidebar__item">
            <a routerLink="/books" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
              <i class="sidebar__icon">📚</i>
              <span>Catalogue de livres</span>
            </a>
          </li>
  
          <!-- Liens pour utilisateurs connectés -->
          <ng-container *ngIf="userInfo.isLoggedIn">
            <li class="sidebar__divider">Mon espace</li>
            <li class="sidebar__item">
              <a routerLink="/profile" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
                <i class="sidebar__icon">👤</i>
                <span>Mon profil</span>
              </a>
            </li>
            <li class="sidebar__item">
              <a routerLink="/profile/loans" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
                <i class="sidebar__icon">📖</i>
                <span>Mes emprunts</span>
              </a>
            </li>
          </ng-container>
  
          <!-- Liens pour administrateurs -->
          <ng-container *ngIf="userInfo.isAdmin">
            <li class="sidebar__divider">Administration</li>
            <li class="sidebar__item">
              <a routerLink="/admin/books/new" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
                <i class="sidebar__icon">➕</i>
                <span>Ajouter un livre</span>
              </a>
            </li>
            <li class="sidebar__item">
              <a routerLink="/admin/loans" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
                <i class="sidebar__icon">📋</i>
                <span>Gestion des emprunts</span>
              </a>
            </li>
            <li class="sidebar__item">
              <a routerLink="/admin/statistics" routerLinkActive="active" class="sidebar__link" (click)="onNavLinkClick()">
                <i class="sidebar__icon">📊</i>
                <span>Statistiques</span>
              </a>
            </li>
          </ng-container>
        </ul>
      </nav>
    </div>
  
    <div class="sidebar__footer">
      <ng-container *ngIf="!userInfo.isLoggedIn">
        <a routerLink="/auth/login" class="sidebar__btn sidebar__btn--login" (click)="onNavLinkClick()">Connexion</a>
        <a routerLink="/auth/register" class="sidebar__btn sidebar__btn--register" (click)="onNavLinkClick()">Inscription</a>
      </ng-container>
      <ng-container *ngIf="userInfo.isLoggedIn">
        <div class="sidebar__user">
          <span class="sidebar__username">{{ userInfo.username }}</span>
        </div>
        <button class="sidebar__btn sidebar__btn--logout" (click)="onLogoutClick()">Déconnexion</button>
      </ng-container>
    </div>
  </aside>
  
  <!-- Overlay pour fermer le sidebar en cliquant à l'extérieur -->
  <div *ngIf="isOpen" class="sidebar__overlay" (click)="onCloseClick()"></div>
