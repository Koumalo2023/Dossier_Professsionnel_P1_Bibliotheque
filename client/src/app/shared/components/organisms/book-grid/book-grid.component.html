<div class="book-grid">
  @if (loading) {
    <!-- Skeleton loader -->
    <div class="book-grid__skeleton">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="book-grid__skeleton-card">
          <div class="skeleton skeleton--cover"></div>
          <div class="skeleton skeleton--title"></div>
          <div class="skeleton skeleton--author"></div>
          <div class="skeleton skeleton--status"></div>
          <div class="skeleton skeleton--btn"></div>
        </div>
      }
    </div>
  } @else if (books.length === 0) {
    <!-- État vide -->
    <div class="book-grid__empty">
      <app-icon name="fa-book" size="3x" color="text-secondary"></app-icon>
      <app-typography variant="body" color="text-secondary" align="center">
        {{ emptyMessage }}
      </app-typography>
    </div>
  } @else {
    <!-- Grille de livres -->
    <div class="book-grid__content">
      @for (book of books; track trackByBookId($index, book)) {
        <app-book-card
          [book]="book"
          [showActions]="showActions"
          (borrow)="onBorrow($event)"
          (reserve)="onReserve($event)"
        ></app-book-card>
      }
    </div>
  }
</div>
