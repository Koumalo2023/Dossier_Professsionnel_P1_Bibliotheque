<header class="navbar">
  <!-- Logo & Titre -->
  <div class="navbar__brand" (click)="onLogoClick()">
    <app-icon name="fa-book" color="primary" size="lg"></app-icon>
    <app-heading level="h4" color="primary" class="navbar__title">
      Bibliothèque Numérique
    </app-heading>
  </div>

  <!-- Navigation Desktop -->
  <nav class="navbar__nav">
    <button class="navbar__link" (click)="navigateTo('/books')">
      <app-typography variant="body" weight="medium">Catalogue</app-typography>
    </button>

    @if (isLoggedIn()) {
      <button class="navbar__link" (click)="navigateTo('/profile')">
        <app-typography variant="body" weight="medium">Mon Profil</app-typography>
      </button>

      @if (isAdminOrManager()) {
        <button class="navbar__link" (click)="navigateTo('/admin/statistics')">
          <app-typography variant="body" weight="medium">Admin</app-typography>
        </button>
      }
    }
  </nav>

  <!-- Actions droite -->
  <div class="navbar__actions">
    @if (isLoggedIn()) {
      <!-- Avatar utilisateur -->
      <div class="navbar__user" (click)="onLogout()">
        <app-user-avatar
          [user]="userInfo!"
          size="md"
          [clickable]="true"
        ></app-user-avatar>
      </div>
    } @else {
      <app-button variant="outline" size="small" (clicked)="navigateTo('/auth/login')">
        <app-icon name="fa-sign-in-alt" size="sm"></app-icon>
        Connexion
      </app-button>
    }

    <!-- Bouton sidebar mobile -->
    <button class="navbar__mobile-toggle" (click)="onToggleSidebar()" aria-label="Menu">
      <app-icon name="fa-bars" size="lg" color="primary"></app-icon>
    </button>
  </div>
</header>
