<div class="category-preferences">
  <app-heading level="h4" color="primary">Préférences par catégorie</app-heading>
  <app-typography variant="body" color="text-secondary" class="category-preferences__hint">
    Sélectionnez les catégories qui vous intéressent pour personnaliser vos recommandations.
  </app-typography>

  @if (loading) {
    <div class="category-preferences__skeleton">
      @for (i of [1,2,3,4,5,6]; track i) {
        <div class="skeleton skeleton--category"></div>
      }
    </div>
  } @else {
    <div class="category-preferences__grid">
      @for (category of availableCategories; track category.id) {
        <label class="category-preferences__item">
          <input
            type="checkbox"
            [checked]="isCategorySelected(category.id)"
            (change)="toggleCategory(category.id)"
            class="category-preferences__checkbox"
            [attr.aria-label]="'Préférer la catégorie ' + category.name"
          />
          <span class="category-preferences__label">
            {{ category.name }}
          </span>
        </label>
      }
    </div>
  }
</div>
