<div class="app-loader" [class]="'app-loader--' + variant + ' app-loader--' + size + ' app-loader--' + color">
  @if (variant === 'spinner') {
    <div class="app-loader__spinner"></div>
  } @else if (variant === 'dots') {
    <div class="app-loader__dots">
      <span></span>
      <span></span>
      <span></span>
    </div>
  } @else if (variant === 'bar') {
    <div class="app-loader__bar"></div>
  }

  @if (label) {
    <span class="app-loader__label">{{ label }}</span>
  }
</div>
