<nav class="navbar">
    <div class="container">
      <div class="navbar__brand">
        <button class="navbar__toggle" (click)="toggleMobileMenu()" aria-label="Menu">
          <span class="navbar__toggle-icon"></span>
        </button>
        <a routerLink="/" class="navbar__logo">
          <span class="navbar__title">Bibliothèque</span>
        </a>
      </div>
  
      <div class="navbar__menu" [class.navbar__menu--open]="isMobileMenuOpen">
        <ul class="navbar__nav">
          <li class="navbar__item">
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="navbar__link" (click)="closeMobileMenu()">Accueil</a>
          </li>
          <li class="navbar__item">
            <a routerLink="/books" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Livres</a>
          </li>
          
          <!-- Liens pour utilisateurs connectés -->
          <ng-container *ngIf="userInfo.isLoggedIn">
            <li class="navbar__item">
              <a routerLink="/profile" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Mon Profil</a>
            </li>
            <li class="navbar__item">
              <a routerLink="/profile/loans" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Mes Emprunts</a>
            </li>
            
            <!-- Liens pour administrateurs -->
            <ng-container *ngIf="userInfo.isAdmin">
              <li class="navbar__item navbar__item--admin">
                <a routerLink="/admin/books/new" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Ajouter un Livre</a>
              </li>
              <li class="navbar__item navbar__item--admin">
                <a routerLink="/admin/loans" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Gestion Emprunts</a>
              </li>
              <li class="navbar__item navbar__item--admin">
                <a routerLink="/admin/statistics" routerLinkActive="active" class="navbar__link" (click)="closeMobileMenu()">Statistiques</a>
              </li>
            </ng-container>
          </ng-container>
        </ul>
  
        <div class="navbar__auth">
          <ng-container *ngIf="!userInfo.isLoggedIn">
            <a routerLink="/auth/login" routerLinkActive="active" class="navbar__btn navbar__btn--login" (click)="closeMobileMenu()">Connexion</a>
            <a routerLink="/auth/register" routerLinkActive="active" class="navbar__btn navbar__btn--register" (click)="closeMobileMenu()">Inscription</a>
          </ng-container>
          <ng-container *ngIf="userInfo.isLoggedIn">
            <span class="navbar__username">{{ userInfo.username }}</span>
            <button class="navbar__btn navbar__btn--logout" (click)="onLogoutClick()">Déconnexion</button>
          </ng-container>
        </div>
      </div>
    </div>
  </nav>
  
  <!-- Overlay pour fermer le menu mobile en cliquant à l'extérieur -->
  <div *ngIf="isMobileMenuOpen" class="navbar__overlay" (click)="closeMobileMenu()"></div>
